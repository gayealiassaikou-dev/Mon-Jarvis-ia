<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <meta name="theme-color" content="#080d18">
    <meta name="color-scheme" content="dark light">
    <title>Sam Sarr</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<aside id="barre-laterale" class="barre-laterale">
    <div class="barre-laterale-entete">
        <div class="barre-titre">Sam Sarr</div>
        <button type="button" id="nouvelle-discussion">+ Nouvelle discussion</button>
    </div>
    <section id="historique" class="historique">
        <h2>Mes conversations</h2>
        <div id="liste-conversations"></div>
    </section>
</aside>

<div class="espace-travail">
<header class="barre">
    <button type="button" id="bouton-historique"
            aria-label="Ouvrir ou fermer le menu des conversations"
            aria-expanded="false">☰</button>
    <div class="barre-titre">Sam Sarr</div>
</header>

<main id="fil" class="fil">
    {% if not message and not reponse %}
    <div id="accueil" class="accueil">
        <div class="logo-grand" role="img" aria-label="Œil bleu de Sam Sarr">
            <svg class="oeil-anime" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs><linearGradient id="iris-bleu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be8ff"/><stop offset=".5" stop-color="#168bff"/><stop offset="1" stop-color="#1239b8"/></linearGradient></defs>
                <path d="M12 75 C42 31 82 12 120 12 C158 12 198 31 228 75 C198 119 158 138 120 138 C82 138 42 119 12 75Z" fill="#071b35" stroke="#42baff" stroke-width="5"/>
                <g class="iris">
                    <circle cx="120" cy="75" r="38" fill="url(#iris-bleu)" stroke="#9be8ff" stroke-width="3"/>
                    <circle cx="120" cy="75" r="19" fill="#020817"/>
                    <circle cx="108" cy="61" r="8" fill="white"/>
                    <circle cx="137" cy="88" r="4" fill="#bcecff"/>
                </g>
                <path d="M32 75 C58 46 87 34 120 34 C153 34 182 46 208 75" fill="none" stroke="#8cddff" stroke-width="2" opacity=".55"/>
            </svg>
        </div>
        <h1>Comment puis-je t'aider ?</h1>
    </div>
    {% endif %}

    {% if message %}
    <div class="ligne utilisateur"><div class="bulle">{{ message }}</div></div>
    {% endif %}

    {% if reponse %}
    <div class="ligne assistant">
        <div class="avatar" role="img" aria-label="Œil de Sam Sarr">
        <svg class="oeil-anime" viewBox="0 0 240 150" aria-hidden="true">
            <path d="M12 75 C42 31 82 12 120 12 C158 12 198 31 228 75 C198 119 158 138 120 138 C82 138 42 119 12 75Z" fill="#071b35" stroke="#42baff" stroke-width="7"/>
            <g class="iris">
                <circle cx="120" cy="75" r="38" fill="#168bff" stroke="#9be8ff" stroke-width="5"/>
                <circle cx="120" cy="75" r="19" fill="#020817"/>
                <circle cx="108" cy="61" r="8" fill="white"/>
                <circle cx="137" cy="88" r="4" fill="#bcecff"/>
            </g>
        </svg>
    </div>
        <div class="texte" data-brut="{{ reponse }}"></div>
    </div>
    {% endif %}
</main>

<form id="formulaire" class="saisie">
    <div class="boite">
        <textarea id="champ" rows="1" placeholder="Pose ta question à Sam Sarr" autocomplete="off"></textarea>
        <button type="button" id="micro" aria-label="Démarrer l'enregistrement" title="Parler à Sam Sarr">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="2" width="6" height="13" rx="3"></rect>
                <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path>
            </svg>
        </button>
        <button type="submit" id="envoi" aria-label="Envoyer">&#8593;</button>
    </div>
    <p class="note">Sam Sarr peut faire des erreurs. Vérifie les informations importantes.</p>
</form>
</div>

<script>
const fil = document.getElementById('fil');
const champ = document.getElementById('champ');
const formulaire = document.getElementById('formulaire');
const envoi = document.getElementById('envoi');
const micro = document.getElementById('micro');
const accueil = document.getElementById('accueil');
const FENCE = String.fromCharCode(96).repeat(3);
let occupe = false;
let lectureVocaleActivee = false;
let confirmationVocaleEnAttente = false;
let audioVocalEnCours = null;

function echapper(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function enLigne(t) {
    t = echapper(t);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
}

function markdown(src) {
    const lignes = src.replace(/\r/g, '').split('\n');
    let html = '';
    let liste = null;
    let code = false;
    let bloc = [];
    const fermer = function () {
        if (liste) { html += '</' + liste + '>'; liste = null; }
    };
    for (const l of lignes) {
        if (l.trim().indexOf(FENCE) === 0) {
            if (code) {
                html += '<pre><code>' + echapper(bloc.join('\n')) + '</code></pre>';
                bloc = [];
                code = false;
            } else {
                fermer();
                code = true;
            }
            continue;
        }
        if (code) { bloc.push(l); continue; }
        let m;
        if ((m = l.match(/^#{1,4}\s+(.*)$/))) {
            fermer();
            html += '<h3>' + enLigne(m[1]) + '</h3>';
        } else if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) {
            if (liste !== 'ul') { fermer(); html += '<ul>'; liste = 'ul'; }
            html += '<li>' + enLigne(m[1]) + '</li>';
        } else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) {
            if (liste !== 'ol') { fermer(); html += '<ol>'; liste = 'ol'; }
            html += '<li>' + enLigne(m[1]) + '</li>';
        } else if (l.trim() === '') {
            fermer();
        } else {
            fermer();
            html += '<p>' + enLigne(l) + '</p>';
        }
    }
    fermer();
    if (code) { html += '<pre><code>' + echapper(bloc.join('\n')) + '</code></pre>'; }
    return html;
}

function defiler() {
    fil.scrollTo({ top: fil.scrollHeight, behavior: 'smooth' });
}

function ajouterUtilisateur(t) {
    const l = document.createElement('div');
    l.className = 'ligne utilisateur';
    const b = document.createElement('div');
    b.className = 'bulle';
    b.textContent = t;
    l.appendChild(b);
    fil.appendChild(l);
    defiler();
}

function ajouterAssistant() {
    const l = document.createElement('div');
    l.className = 'ligne assistant';
    l.innerHTML = `<div class="avatar" role="img" aria-label="Œil de Sam Sarr">
        <svg class="oeil-anime" viewBox="0 0 240 150" aria-hidden="true">
            <path d="M12 75 C42 31 82 12 120 12 C158 12 198 31 228 75 C198 119 158 138 120 138 C82 138 42 119 12 75Z" fill="#071b35" stroke="#42baff" stroke-width="7"/>
            <g class="iris">
                <circle cx="120" cy="75" r="38" fill="#168bff" stroke="#9be8ff" stroke-width="5"/>
                <circle cx="120" cy="75" r="19" fill="#020817"/>
                <circle cx="108" cy="61" r="8" fill="white"/>
                <circle cx="137" cy="88" r="4" fill="#bcecff"/>
            </g>
        </svg>
    </div><div class="texte"></div>`;
    fil.appendChild(l);
    defiler();
    return l.querySelector('.texte');
}

function reflechir(zone) {
    zone.innerHTML = '<span class="points"><i></i><i></i><i></i></span>';
}

function ecrire(zone, texte) {
    return new Promise(function (fin) {
        const pas = Math.max(2, Math.ceil(texte.length / 150));
        let n = 0;
        const t = setInterval(function () {
            n = Math.min(texte.length, n + pas);
            zone.innerHTML = markdown(texte.slice(0, n));
            defiler();
            if (n >= texte.length) { clearInterval(t); fin(); }
        }, 20);
    });
}

function creerPanneauActivite(zoneAssistant) {
    const panneau = document.createElement('section');
    panneau.className = 'activite ouverte';

    const bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'activite-bouton';
    bouton.setAttribute('aria-expanded', 'true');

    const point = document.createElement('span');
    point.className = 'activite-point';

    const titre = document.createElement('span');
    titre.className = 'activite-titre';
    titre.textContent = 'Sam Sarr travaille…';

    const fleche = document.createElement('span');
    fleche.className = 'activite-fleche';
    fleche.textContent = '⌄';

    bouton.append(point, titre, fleche);

    const details = document.createElement('div');
    details.className = 'activite-details';

    bouton.addEventListener('click', function () {
        const ouverte = panneau.classList.toggle('ouverte');
        bouton.setAttribute('aria-expanded', String(ouverte));
    });

    panneau.append(bouton, details);
    const ligneAssistant = zoneAssistant.closest('.ligne.assistant');
    if (ligneAssistant && ligneAssistant.parentNode === fil) {
        fil.insertBefore(panneau, ligneAssistant);
    } else {
        fil.appendChild(panneau);
    }
    defiler();

    return { panneau, bouton, titre, details };
}

function actualiserActivite(interfaceActivite, activite) {
    const { panneau, bouton, titre, details } = interfaceActivite;

    if (activite.etat === 'terminee') {
        panneau.classList.add('terminee');
        panneau.classList.remove('echec');
        titre.textContent = 'Sam Sarr a terminé';
    } else if (activite.etat === 'echec') {
        panneau.classList.add('echec');
        panneau.classList.remove('terminee');
        titre.textContent = 'Sam Sarr a rencontré un problème';
    } else {
        titre.textContent = 'Sam Sarr travaille…';
    }

    details.replaceChildren();

    for (const etape of (activite.etapes || [])) {
        const ligne = document.createElement('div');
        ligne.className = 'activite-etape';

        if (['en_cours', 'succes', 'echec'].includes(etape.statut)) {
            ligne.classList.add(etape.statut);
        }

        const marque = document.createElement('span');
        marque.className = 'activite-etape-marque';
        marque.textContent = etape.statut === 'succes' ? '✓'
            : etape.statut === 'echec' ? '!'
            : etape.statut === 'en_cours' ? '●' : '·';

        const texte = document.createElement('span');
        texte.textContent = etape.message || 'Activité en cours';

        ligne.append(marque, texte);
        details.appendChild(ligne);
    }

    bouton.setAttribute('aria-label', titre.textContent);
    defiler();
}

async function surveillerActivite(id, interfaceActivite) {
    for (let tentative = 0; tentative < 180; tentative++) {
        try {
            const r = await fetch('/activite/' + encodeURIComponent(id));
            if (r.ok) {
                const activite = await r.json();
                actualiserActivite(interfaceActivite, activite);

                if (activite.etat !== 'en_cours') {
                    return activite;
                }
            }
        } catch (e) {
            // Une erreur passagère de lecture ne bloque pas la réponse.
        }

        await new Promise(function (fin) {
            setTimeout(fin, 800);
        });
    }

    return null;
}


let conversationActive = null;

async function chargerListeConversations() {
    const liste = document.getElementById('liste-conversations');
    liste.replaceChildren();

    try {
        const r = await fetch('/conversations', { cache: 'no-store' });
        if (!r.ok) throw new Error('Historique indisponible');

        const conversations = await r.json();

        if (!conversations.length) {
            const vide = document.createElement('p');
            vide.className = 'conversation-vide';
            vide.textContent = 'Aucune conversation enregistrée pour le moment.';
            liste.appendChild(vide);
            return;
        }

        for (const conversation of conversations) {
            const bouton = document.createElement('button');
            bouton.type = 'button';
            bouton.className = 'conversation-element';
            bouton.textContent = conversation.titre || 'Nouvelle discussion';

            if (conversation.id === conversationActive) {
                bouton.classList.add('active');
            }

            bouton.addEventListener('click', function () {
                chargerConversation(conversation.id);
            });

            liste.appendChild(bouton);
        }
    } catch (e) {
        const erreur = document.createElement('p');
        erreur.className = 'conversation-vide';
        erreur.textContent = 'Impossible de charger l’historique.';
        liste.appendChild(erreur);
    }
}

async function chargerConversation(identifiant) {
    try {
        const r = await fetch(
            '/conversations/' + encodeURIComponent(identifiant),
            { cache: 'no-store' }
        );

        if (!r.ok) throw new Error('Conversation indisponible');

        const donnees = await r.json();

        conversationActive = donnees.conversation.id;
        try {
            localStorage.setItem('sam_sarr_conversation_id', conversationActive);
        } catch (e) {}

        fil.replaceChildren();

        for (const message of donnees.messages) {
            if (message.role === 'user') {
                ajouterUtilisateur(message.content);
            } else if (message.role === 'assistant') {
                const zone = ajouterAssistant();
                zone.innerHTML = markdown(message.content);
            }
        }

        fermerMenuMobile();
        document.getElementById('bouton-historique').setAttribute('aria-expanded', 'false');
        await chargerListeConversations();
        defiler();
    } catch (e) {
        alert('Impossible de charger cette conversation. Réessaie.');
    }
}

function demarrerNouvelleDiscussion() {
    conversationActive = null;
    try {
        localStorage.removeItem('sam_sarr_conversation_id');
    } catch (e) {}

    fil.replaceChildren();

    const accueilNouveau = document.createElement('div');
    accueilNouveau.className = 'accueil';

    const logo = document.createElement('div');
    logo.className = 'logo-grand';
    logo.innerHTML = `<svg class="oeil-anime" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="iris-bleu-nouveau" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be8ff"/><stop offset=".5" stop-color="#168bff"/><stop offset="1" stop-color="#1239b8"/></linearGradient></defs>
        <path d="M12 75 C42 31 82 12 120 12 C158 12 198 31 228 75 C198 119 158 138 120 138 C82 138 42 119 12 75Z" fill="#071b35" stroke="#42baff" stroke-width="5"/>
        <g class="iris"><circle cx="120" cy="75" r="38" fill="url(#iris-bleu-nouveau)" stroke="#9be8ff" stroke-width="3"/><circle cx="120" cy="75" r="19" fill="#020817"/><circle cx="108" cy="61" r="8" fill="white"/><circle cx="137" cy="88" r="4" fill="#bcecff"/></g>
        <path d="M32 75 C58 46 87 34 120 34 C153 34 182 46 208 75" fill="none" stroke="#8cddff" stroke-width="2" opacity=".55"/>
    </svg>`;

    const titre = document.createElement('h1');
    titre.textContent = 'Comment puis-je t’aider ?';

    accueilNouveau.append(logo, titre);
    fil.appendChild(accueilNouveau);

    fermerMenuMobile();
    document.getElementById('bouton-historique').setAttribute('aria-expanded', 'false');
    champ.focus();
    chargerListeConversations();
}

document.getElementById('nouvelle-discussion').addEventListener(
    'click', demarrerNouvelleDiscussion
);

function fermerMenuMobile() {
    document.body.classList.remove('menu-ouvert');
    document.getElementById('bouton-historique').setAttribute('aria-expanded', 'false');
}

document.getElementById('bouton-historique').addEventListener('click', function () {
    const ouvert = document.body.classList.toggle('menu-ouvert');
    this.setAttribute('aria-expanded', String(ouvert));
    if (ouvert) {
        chargerListeConversations();
    }
});

function normaliserCommande(texte) {
    return String(texte || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

async function lireReponseAudio(texte, zone) {
    try {
        const resultat = await fetch("/api/audio/synthetiser", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ texte: texte })
        });

        if (!resultat.ok) {
            throw new Error("La synthèse vocale est indisponible.");
        }

        const urlAudio = URL.createObjectURL(await resultat.blob());
        const audio = new Audio(urlAudio);

        if (audioVocalEnCours) {
            audioVocalEnCours.pause();
        }
        audioVocalEnCours = audio;

        audio.addEventListener("ended", function () {
            URL.revokeObjectURL(urlAudio);
            if (audioVocalEnCours === audio) audioVocalEnCours = null;
        }, { once: true });

        try {
            await audio.play();
        } catch (erreurLecture) {
            const bouton = document.createElement("button");
            bouton.type = "button";
            bouton.textContent = "▶ Écouter la réponse";
            bouton.addEventListener("click", function () {
                audio.play().catch(function () {
                    bouton.textContent = "Lecture audio impossible";
                });
            });
            zone.appendChild(bouton);
        }
    } catch (erreur) {
        const note = document.createElement("p");
        note.textContent = "Voix indisponible : " + erreur.message;
        zone.appendChild(note);
    }
}

async function afficherReponseLocale(question, reponse, lire) {
    occupe = true;
    envoi.disabled = true;

    try {
        if (accueil) accueil.remove();
        ajouterUtilisateur(question);
        const zone = ajouterAssistant();
        await ecrire(zone, reponse);
        if (lire) await lireReponseAudio(reponse, zone);
    } finally {
        occupe = false;
        envoi.disabled = false;
        champ.focus();
    }
}

async function envoyer(texte) {
    if (occupe) { return; }

    const commande = normaliserCommande(texte);

    if (confirmationVocaleEnAttente &&
        /^(oui|ouais|daccord|dac|bien sur|vas y|fais ca|fait ca)(\b|\s)/.test(commande)) {
        confirmationVocaleEnAttente = false;
        lectureVocaleActivee = true;
        await afficherReponseLocale(
            texte,
            "D'accord. Je lirai maintenant mes réponses à haute voix. Dis « arrête la voix » pour désactiver.",
            true
        );
        return;
    }

    if (/(arrete|stop|desactive|coupe).*(voix|lecture|parler)/.test(commande)) {
        confirmationVocaleEnAttente = false;
        lectureVocaleActivee = false;
        if (audioVocalEnCours) {
            audioVocalEnCours.pause();
            audioVocalEnCours = null;
        }
        await afficherReponseLocale(
            texte,
            "D'accord, la lecture à haute voix est désactivée.",
            false
        );
        return;
    }

    if (/(haute voix|voix haute|oralement)/.test(commande) &&
        /(repond|parl|lis)/.test(commande)) {
        confirmationVocaleEnAttente = true;
        await afficherReponseLocale(
            texte,
            "Oui. Je peux lire mes réponses à haute voix. Souhaites-tu activer cette fonction ?",
            false
        );
        return;
    }

    const demandeMusique = texte.match(
        /^(?:s'il te plait\s+)?(?:joue|lance|mets|cherche|recherche|trouve)\s+(?:moi\s+)?(?:la\s+)?(?:musique|chanson|morceau|son)\s+(?:de\s+)?(.+)$/i
    );

    if (demandeMusique) {
        const titre = demandeMusique[1]
            .replace(/\s+sur\s+(youtube|spotify)\s*$/i, "")
            .trim();
        const spotify = /spotify/.test(commande);
        const url = spotify
            ? "https://open.spotify.com/search/" + encodeURIComponent(titre)
            : "https://www.youtube.com/results?search_query=" + encodeURIComponent(titre);

        const fenetre = window.open(url, "_blank");
        if (fenetre) {
            fenetre.opener = null;
        } else {
            window.location.assign(url);
        }

        await afficherReponseLocale(
            texte,
            "J'ouvre la recherche de « " + titre + " » sur " +
                (spotify ? "Spotify." : "YouTube."),
            false
        );
        return;
    }

    occupe = true;
    envoi.disabled = true;

    if (accueil) { accueil.remove(); }

    ajouterUtilisateur(texte);

    const zone = ajouterAssistant();
    reflechir(zone);

    let id = null;
    let surveillance = null;

    try {
        const depart = await fetch('/activite/demarrer', {
            method: 'POST'
        });

        if (depart.ok) {
            const donneesDepart = await depart.json();
            id = donneesDepart.demande_id;

            if (typeof id === 'string' && id.length > 0) {
                const interfaceActivite = creerPanneauActivite(zone);
                surveillance = surveillerActivite(id, interfaceActivite);
            } else {
                id = null;
            }
        }
    } catch (e) {
        // Le chat reste utilisable même si le suivi est indisponible.
    }

    try {
        const r = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify((function () {
                const donnees = { message: texte };
                if (id) donnees.demande_id = id;
                if (conversationActive) {
                    donnees.conversation_id = conversationActive;
                }
                return donnees;
            })())
        });

        const d = await r.json();

        if (!r.ok) {
            throw new Error(d.reponse || 'Erreur pendant la demande.');
        }

        if (d.conversation_id) {
            conversationActive = d.conversation_id;
            try {
                localStorage.setItem(
                    'sam_sarr_conversation_id', conversationActive
                );
            } catch (e) {}
            await chargerListeConversations();
        }

        await ecrire(zone, d.reponse || 'Réponse vide.');
        if (lectureVocaleActivee) {
            await lireReponseAudio(d.reponse || 'Réponse vide.', zone);
        }
    } catch (e) {
        zone.textContent = 'Erreur de connexion. Réessaie.';
    } finally {
        if (surveillance) {
            await surveillance;
        }

        occupe = false;
        envoi.disabled = false;
        champ.focus();
    }
}

function ajuster() {
    champ.style.height = 'auto';
    champ.style.height = Math.min(champ.scrollHeight, 160) + 'px';
}


let enregistreur = null;
let fluxMicro = null;
let morceauxAudio = [];

micro.addEventListener('click', async function () {
    if (occupe) return;

    if (enregistreur && enregistreur.state === 'recording') {
        enregistreur.stop();
        micro.classList.remove('enregistrement');
        micro.disabled = true;
        micro.setAttribute('aria-label', 'Enregistrement terminé');
        return;
    }

    try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia ||
            typeof MediaRecorder === 'undefined') {
            throw new Error("L'enregistrement audio n'est pas pris en charge par ce navigateur.");
        }

        fluxMicro = await navigator.mediaDevices.getUserMedia({ audio: true });
        morceauxAudio = [];

        let typeAudio = '';
        if (MediaRecorder.isTypeSupported('audio/webm')) {
            typeAudio = 'audio/webm';
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            typeAudio = 'audio/mp4';
        } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
            typeAudio = 'audio/ogg';
        }

        enregistreur = new MediaRecorder(
            fluxMicro,
            typeAudio ? { mimeType: typeAudio } : undefined
        );

        enregistreur.ondataavailable = function (e) {
            if (e.data && e.data.size > 0) morceauxAudio.push(e.data);
        };

        enregistreur.onstop = async function () {
            try {
                const blob = new Blob(morceauxAudio, {
                    type: enregistreur.mimeType || 'audio/webm'
                });

                if (blob.size === 0) {
                    throw new Error("Aucun son n'a été enregistré.");
                }

                const extension = blob.type.includes('mp4') ? 'mp4' :
                    blob.type.includes('ogg') ? 'ogg' : 'webm';

                const donnees = new FormData();
                donnees.append('audio', blob, 'sam-sarr.' + extension);

                micro.title = 'Transcription en cours…';

                const resultat = await fetch('/api/audio/transcrire', {
                    method: 'POST',
                    body: donnees
                });

                const reponse = await resultat.json();

                if (!resultat.ok || !reponse.message) {
                    throw new Error(reponse.erreur || 'Transcription impossible.');
                }

                champ.value = reponse.message;
                ajuster();
                envoyer(reponse.message);
                champ.value = '';
                ajuster();
            } catch (erreur) {
                alert(erreur.message || 'Erreur pendant la transcription.');
            } finally {
                if (fluxMicro) {
                    fluxMicro.getTracks().forEach(piste => piste.stop());
                    fluxMicro = null;
                }
                enregistreur = null;
                morceauxAudio = [];
                micro.disabled = false;
                micro.title = 'Parler à Sam Sarr';
                micro.setAttribute('aria-label', 'Démarrer l’enregistrement');
            }
        };

        enregistreur.start();
        micro.classList.add('enregistrement');
        micro.setAttribute('aria-label', 'Arrêter l’enregistrement');
        micro.title = 'Appuyer pour arrêter';
    } catch (erreur) {
        if (fluxMicro) {
            fluxMicro.getTracks().forEach(piste => piste.stop());
            fluxMicro = null;
        }
        micro.disabled = false;
        alert(erreur.message || "Impossible d'accéder au microphone.");
    }
});

formulaire.addEventListener('submit', function (e) {
    e.preventDefault();
    const t = champ.value.trim();
    if (!t) { return; }
    champ.value = '';
    ajuster();
    envoyer(t);
});

champ.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 768px)').matches) {
        e.preventDefault();

});

champ.addEventListener('input', ajuster);

document.querySelectorAll('.texte[data-brut]').forEach(function (z) {

fil.scrollTop = fil.scrollHeight;

if (accueil) {

}

<style>
.boite{position:relative}
.boite.vocal > *:not(.barre-vocale){visibility:hidden}
.barre-vocale{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;gap:10px;padding:0 10px;z-index:5;color:inherit}
.barre-vocale[hidden]{display:none}
.barre-vocale button{width:36px;height:36px;border:0;border-radius:50%;cursor:pointer;flex:0 0 auto;font-size:18px;line-height:1;color:inherit;background:transparent}
.barre-vocale .bv-envoyer{background:#168bff;color:#fff}
.bv-point{width:10px;height:10px;border-radius:50%;background:#ff4d4f;flex:0 0 auto;animation:bvClignote 1s infinite}
.bv-temps{font-variant-numeric:tabular-nums;font-size:15px;min-width:38px}
.bv-ondes{flex:1;display:flex;align-items:center;gap:3px;height:32px;overflow:hidden}
.bv-ondes span{flex:1;min-width:2px;max-width:5px;height:12%;border-radius:2px;background:#42baff}
@keyframes bvClignote{50%{opacity:.25}}
#transcription-vocale{margin:0 auto 8px;max-width:720px;padding:6px 12px;border:1px solid rgba(66,186,255,.4);border-radius:12px;background:rgba(66,186,255,.12);font-size:14px;text-align:center}
#transcription-vocale[hidden]{display:none}
</style>
<script>
(function () {
  var NB = 28, SEUIL = 600, MIN = 500;
  var boite = champ.parentNode;
  var ancien = document.getElementById('micro');
  var bouton = ancien.cloneNode(true);
  ancien.replaceWith(bouton);
  bouton.style.touchAction = 'none';
  bouton.style.userSelect = 'none';
  bouton.style.webkitUserSelect = 'none';
  bouton.style.webkitTouchCallout = 'none';
  bouton.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  var barre = document.createElement('div');
  barre.className = 'barre-vocale';
  barre.hidden = true;
  var html = '<button type="button" class="bv-annuler" aria-label="Annuler l\'enregistrement">&#10005;</button>' +
    '<span class="bv-point"></span><span class="bv-temps">0:00</span><div class="bv-ondes">';
  for (var i = 0; i < NB; i++) html += '<span></span>';
  html += '</div><button type="button" class="bv-envoyer" aria-label="Envoyer le vocal">&#8593;</button>';
  barre.innerHTML = html;
  boite.appendChild(barre);
  var elTemps = barre.querySelector('.bv-temps');
  var barres = barre.querySelectorAll('.bv-ondes span');

  var puce = document.createElement('div');
  puce.id = 'transcription-vocale';
  puce.hidden = true;
  formulaire.parentNode.insertBefore(puce, formulaire);
  var minuteurPuce = null;
  function cacherPuce() { clearTimeout(minuteurPuce); puce.hidden = true; puce.textContent = ''; }
  function montrerPuce(texte, delai) {
    clearTimeout(minuteurPuce);
    puce.textContent = texte;
    puce.hidden = false;
    if (delai) minuteurPuce = setTimeout(cacherPuce, delai);
  }

  var etat = 'repos', appui = false, tAppui = 0, tDebut = 0, tRelache = 0, dureeMs = 0;
  var flux = null, enr = null, morceaux = [], annule = false;
  var ctx = null, analyseur = null, donnees = null, niveaux = [], tNiv = null, tTemps = null;

  function dessiner() {
    for (var i = 0; i < NB; i++) barres[i].style.height = (12 + niveaux[i] * 88) + '%';
  }
  function formaterTemps(ms) {
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function liberer() {
    clearInterval(tNiv); clearInterval(tTemps);
    if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
    analyseur = null;
    if (flux) { flux.getTracks().forEach(function (p) { p.stop(); }); flux = null; }
    boite.classList.remove('vocal');
    barre.hidden = true;
    bouton.classList.remove('enregistrement');
    bouton.disabled = false;
  }
  function lancerAnalyse() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      if (ctx.resume) ctx.resume();
      var src = ctx.createMediaStreamSource(flux);
      analyseur = ctx.createAnalyser();
      analyseur.fftSize = 256;
      src.connect(analyseur);
      donnees = new Uint8Array(analyseur.fftSize);
      tNiv = setInterval(function () {
        if (!analyseur) return;
        analyseur.getByteTimeDomainData(donnees);
        var somme = 0;
        for (var i = 0; i < donnees.length; i++) { var v = (donnees[i] - 128) / 128; somme += v * v; }
        niveaux.push(Math.min(1, Math.sqrt(somme / donnees.length) * 5));
        niveaux.shift();
        dessiner();
      }, 70);
    } catch (e) {}
  }

  async function demarrer() {
    if (etat !== 'repos' || occupe) return;
    etat = 'demarrage';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
        throw new Error("L'enregistrement audio n'est pas pris en charge par ce navigateur.");
      }
      flux = await navigator.mediaDevices.getUserMedia({ audio: true });
      var type = '';
      if (MediaRecorder.isTypeSupported('audio/webm')) type = 'audio/webm';
      else if (MediaRecorder.isTypeSupported('audio/mp4')) type = 'audio/mp4';
      else if (MediaRecorder.isTypeSupported('audio/ogg')) type = 'audio/ogg';
      morceaux = []; annule = false;
      enr = new MediaRecorder(flux, type ? { mimeType: type } : undefined);
      enr.ondataavailable = function (e) { if (e.data && e.data.size > 0) morceaux.push(e.data); };
      enr.onstop = surArret;
      enr.start();
      tDebut = Date.now();
      if (tDebut - tAppui > SEUIL) appui = false;
      etat = 'enregistrement';
      niveaux = [];
      for (var i = 0; i < NB; i++) niveaux.push(0);
      dessiner();
      elTemps.textContent = '0:00';
      boite.classList.add('vocal');
      barre.hidden = false;
      bouton.classList.add('enregistrement');
      lancerAnalyse();
      tTemps = setInterval(function () { elTemps.textContent = formaterTemps(Date.now() - tDebut); }, 250);
    } catch (e) {
      liberer();
      etat = 'repos';
      montrerPuce(e.message || "Impossible d'accéder au microphone.", 5000);
    }
  }

  function terminer(envoyerVocal) {
    if (etat !== 'enregistrement') return;
    annule = !envoyerVocal;
    dureeMs = Date.now() - tDebut;
    etat = 'traitement';
    bouton.disabled = true;
    try { enr.stop(); } catch (e) { liberer(); etat = 'repos'; }
  }

  async function surArret() {
    var type = (enr && enr.mimeType) || 'audio/webm';
    var blob = new Blob(morceaux, { type: type });
    var abandon = annule;
    var court = dureeMs < MIN;
    enr = null; morceaux = [];
    liberer();
    if (abandon) { etat = 'repos'; return; }
    if (court || blob.size === 0) {
      etat = 'repos';
      montrerPuce('Enregistrement trop court. Réessaie.', 3000);
      return;
    }
    var ext = blob.type.indexOf('mp4') >= 0 ? 'mp4' : (blob.type.indexOf('ogg') >= 0 ? 'ogg' : 'webm');
    var form = new FormData();
    form.append('audio', blob, 'sam-sarr.' + ext);
    bouton.disabled = true;
    montrerPuce('Transcription en cours…');
    var message = null;
    try {
      var r = await fetch('/api/audio/transcrire', { method: 'POST', body: form });
      var d = await r.json();
      if (!r.ok || !d.message) throw new Error(d.erreur || 'Transcription impossible.');
      message = d.message;
    } catch (e) {
      montrerPuce(e.message || 'Erreur pendant la transcription.', 6000);
    }
    bouton.disabled = false;
    etat = 'repos';
    if (!message) return;
    montrerPuce('🎙️ Transcription : « ' + message + ' »');
    Promise.resolve(envoyer(message)).then(cacherPuce, cacherPuce);
  }

  bouton.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;
    e.preventDefault();
    try { bouton.setPointerCapture(e.pointerId); } catch (err) {}
    appui = true;
    tAppui = Date.now();
    demarrer();
  });
  function relacher() {
    if (!appui) return;
    appui = false;
    tRelache = Date.now();
    if (etat === 'enregistrement' && tRelache - tDebut >= SEUIL) terminer(true);
  }
  window.addEventListener('pointerup', relacher);
  window.addEventListener('pointercancel', relacher);
  bouton.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (etat === 'repos') demarrer(); }
  });
  barre.addEventListener('pointerdown', function () { appui = false; });
  barre.querySelector('.bv-annuler').addEventListener('click', function () { terminer(false); });
  barre.querySelector('.bv-envoyer').addEventListener('click', function () { terminer(true); });

  if (typeof window.ecrire === 'function') {
    var ecrireOrigine = window.ecrire;
    window.ecrire = function () { cacherPuce(); return ecrireOrigine.apply(this, arguments); };
  }
})();
</script>
